  - name: 个人网站开发版
    url: https://dev.meali.top
  - name: 博客
    url: https://blog.meali.top
  - name: 通缉令生成器
    url: https://tjl.meali.top
  - name: 文字渲染器
    url: https://tg.meali.top

status-website:
  # Add your custom domain name, or remove the `cname` line if you don't have a domain
  # Uncomment the `baseUrl` line if you don't have a custom domain and add your repo name there
  cname: uptime.meali.top
  # baseUrl: /your-repo-name
  logoUrl: https://meali.top/zdn/me.png
  name: VoidCat - 状态监测
  introTitle: "VoidCat 的状态检测喵~~~"
  introMessage: 让我看看猫猫死没死🔍
  navbar:
    - title: 状态
      href: /
    - title: 个人网站
      href: https://meali.top
    - title: GitHub
      href: https://github.com/$OWNER/$REPO
workflowSchedule:
  # 核心监控：每 5 分钟检测一次网站状态（最高频，确保及时发现宕机）
  uptime: "*/5 * * * *"
  
  # 面板部署：每 15 分钟重新构建并部署一次状态面板网页
  staticSite: "*/15 * * * *"
  
  # 辅助统计：每小时更新一次（防止图表 SVG 导致 Git 仓库体积爆炸）
  graphs: "0 * * * *"           
  responseTime: "0 * * * *"     
  summary: "0 * * * *"          
  
  # 低频维护：每天凌晨更新一次
  updateTemplate: "0 0 * * *"   
  updates: "0 0 * * *"          

# Upptime also supports notifications, assigning issues, and more
# See https://upptime.js.org/docs/configuration
